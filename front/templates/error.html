<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エラー - ASA Project</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .error-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            text-align: center;
        }
        
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #d32f2f;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .error-message {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 16px;
        }
        
        .instructions {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 4px;
            text-align: left;
            margin-top: 20px;
        }
        
        .instructions h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
        }
        
        .instructions code {
            background-color: #e9ecef;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: #d32f2f;
        }
        
        .instructions ol {
            margin-left: 20px;
            color: #666;
        }
        
        .instructions li {
            margin-bottom: 10px;
            line-height: 1.6;
        }
        
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        .back-button:hover {
            background-color: #357ae8;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1>エラーが発生しました</h1>
        <p class="error-message">{{ error_message }}</p>
        
        <div class="instructions">
            <h2>📝 設定方法</h2>
            <ol>
                <li>Google Cloud Consoleで<a href="https://console.cloud.google.com/" target="_blank">プロジェクトを作成</a></li>
                <li>Maps JavaScript APIを有効化</li>
                <li>APIキーを作成</li>
                <li>環境変数 <code>GOOGLE_MAPS_API_KEY</code> を設定</li>
            </ol>
            <p style="margin-top: 15px; color: #666;">
                例: <code>export GOOGLE_MAPS_API_KEY="your_api_key_here"</code>
            </p>
        </div>
        
        <a href="/" class="back-button">リロード</a>
    </div>
</body>
</html>
